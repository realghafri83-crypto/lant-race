function finish(){state='end';var st=ok>=11?3:ok>=8?2:ok>=5?1:0;$('res').innerHTML='<div style="font-size:2.2em">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'</div>إجاباتك الصحيحة: <b>'+ok+'</b> من 12<br>النقاط: <b>'+score+'</b> &nbsp; العملات: <b>'+coins+'</b> 🪙<br>النباتات فخورة بكم!<br><small>إعداد الأستاذة: مريم الغافري</small>';$('end').style.display='flex'}
var clk=new THREE.Clock(),q=$('q'),fr=0;

var target=play?ST[stage].sp:(state=='menu'?14:0);sp+=(target-sp)*Math.min(1,dt*(play?1.4:2));D+=sp*dt;
inp=play?(Rr-L):0;vx+=(inp*15-vx)*Math.min(1,dt*8);cx=Math.max(-5.8,Math.min(5.8,cx+vx*dt));

wh.forEach(function(w){w.rotation.x-=sp*dt*1.9});
rg.position.z=-D;var base=-Math.floor(D/14)*14;dash.forEach(function(d,i){d.position.z=base-(i-3)*14+D});

if(play){
ent.forEach(function(e){if(e.t=='c'){e.m.rotation.y+=dt*4;if(!e.got&&Math.abs(D-e.d)<1.6&&Math.abs(cx-e.m.position.x)<1.9){e.got=1;e.m.visible=false;coins++;score+=2;beep(900,.1)}}

else{sp*=.6;shake=.3;beep(180,.3,'sawtooth');fbH='❌ الإجابة الصحيحة: '+e.r}fbT=2.4}});
var cur=ent.filter(function(e){return e.t=='g'&&!e.done})[0];
if(fbT>0){fbT-=dt;q.style.display='block';q.innerHTML=fbH}
else if(cur&&cur.d-D<320){q.style.display='block';q.innerHTML='<small>السؤال '+cur.n+' من 12</small>'+cur.q+(cur.n==10?SVGI:'')+'<div class="a"><b style="background:#1e88e5">◀ يسار</b><b style="background:#f57c00">يمين ▶</b></div>'}
else q.style.display='none';

else q.style.display='none';
shake=Math.max(0,shake-dt);var sh=shake*(Math.random()-.5)*1.2;
cam.position.set(cx*.6+sh,4.6+sh*.5,-D+9.5);cam.lookAt(cx*.4,1.5,-D-12);
if(fr++%4==0){$('sc').textContent=score;$('cn').textContent=coins;$('sd').textContent=Math.round(sp*3);$('bar').firstChild.style.width=Math.min(100,(D-0)/(4*LEN)*100)+'%'}
R.render(S,cam)}
startStage(0);tick();
})();
